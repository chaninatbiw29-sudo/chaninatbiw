<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ระบบลงทะเบียนนักศึกษา</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            max-width: 760px;
            margin: 30px auto;
            padding: 0 16px;
        }
        input, button {
            padding: 9px;
            margin: 4px 0;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #1f883d;
            color: #fff;
            border: 0;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #1a7534;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 7px;
            text-align: left;
        }
        th {
            background: #eef5f1;
        }
        #msg {
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>ระบบลงทะเบียนนักศึกษา</h1>
    
    <input id="first_name" placeholder="ชื่อ">
    <input id="last_name" placeholder="นามสกุล">
    <input id="nickname" placeholder="ชื่อเล่น">
    <input id="student_id" placeholder="เลขนักศึกษา">
    <input id="major" placeholder="สาขาวิชา">
    
    <button onclick="register()">ลงทะเบียน</button>
    <p id="msg"></p>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>ชื่อ-นามสกุล</th>
                <th>ชื่อเล่น</th>
                <th>เลขนักศึกษา</th>
                <th>สาขาวิชา</th>
            </tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 1) เชื่อมต่อ Supabase (เปลี่ยนสองบรรทัดนี้เป็นของคุณ)
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const fields = ['first_name', 'last_name', 'nickname', 'student_id', 'major'];
        const val = (id) => document.getElementById(id).value.trim();

        // 2) เพิ่มข้อมูลลงทะเบียน
        async function register() {
            const msg = document.getElementById('msg');
            msg.style.color = 'black';

            const row = {
                first_name: val('first_name'),
                last_name: val('last_name'),
                nickname: val('nickname'),
                student_id: val('student_id'),
                major: val('major')
            };

            if (!row.first_name || !row.last_name || !row.student_id || !row.major) {
                msg.textContent = 'กรุณากรอกข้อมูลให้ครบถ้วน (ยกเว้นชื่อเล่น)';
                msg.style.color = 'red';
                return;
            }

            const { error } = await db.from('registrations').insert(row);
            
            if (error) {
                msg.style.color = 'red';
                if (error.code === '23505') {
                    msg.textContent = 'เลขนักศึกษานี้ลงทะเบียนแล้ว';
                } else {
                    msg.textContent = 'เกิดข้อผิดพลาด: ' + error.message;
                }
                return;
            }

            msg.textContent = 'ลงทะเบียนสำเร็จ!';
            msg.style.color = 'green';
            fields.forEach((id) => document.getElementById(id).value = '');
            loadRows();
        }

        // 3) ดึงข้อมูลมาแสดงเป็นตาราง
        async function loadRows() {
            const { data, error } = await db
                .from('registrations')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('เกิดข้อผิดพลาดในการดึงข้อมูล:', error);
                return;
            }

            const tbody = document.getElementById('rows');
            tbody.innerHTML = '';

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${row.first_name} ${row.last_name}</td>
                    <td>${row.nickname || '-'}</td>
                    <td>${row.student_id}</td>
                    <td>${row.major}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4) ดึงข้อมูลมาแสดงทันทีที่โหลดหน้าเว็บ
        loadRows();
    </script>
</body>
</html>
